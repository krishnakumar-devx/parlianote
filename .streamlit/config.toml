[theme]
# "The Record": warm paper, black ink. The rest of the look (fonts, highlighter, rules) is in src/ui/components.py.
base = "light"
primaryColor = "#16140F"
backgroundColor = "#F7F5F0"
secondaryBackgroundColor = "#FFFDF8"
textColor = "#16140F"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
fileWatcherType = "none"
headless = true
